<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGT RFP Pitch Game</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
*{margin:0;padding:0;box-sizing:border-box;}
:root{
--corn:#E3CC02;
--maroon:#3B0A0F;
--accent-red:#FF4444;
--accent-blue:#44CCFF;
--bg-dark:#0a0e27;
--text-light:#ffffff;
}
body{font-family:'Press Start 2P',cursive;background:linear-gradient(135deg,var(--bg-dark) 0%,#1a1a3e 100%);color:var(--text-light);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;overflow:hidden;}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background:repeating-linear-gradient(0deg,rgba(255,255,255,0.03) 0px,rgba(255,255,255,0.03) 1px,transparent 1px,transparent 2px);pointer-events:none;z-index:999;animation:scanlines 8s linear infinite;}
@keyframes scanlines{0%{transform:translateY(0);}100%{transform:translateY(10px);}}
.game-container{width:100%;max-width:1000px;background:linear-gradient(135deg,#1a1a3e 0%,#2d1b4e 100%);border:8px solid var(--corn);box-shadow:0 0 40px rgba(227,204,2,0.5),inset 0 0 40px rgba(59,10,15,0.3);padding:40px;position:relative;z-index:1;}
.game-title{text-align:center;font-size:1.5rem;margin-bottom:20px;color:var(--corn);text-shadow:2px 2px 0 var(--maroon),4px 4px 0 var(--accent-blue);animation:titlePulse 1s infinite;}
@keyframes titlePulse{0%,100%{transform:scale(1);}50%{transform:scale(1.05);}}
.subtitle{text-align:center;font-size:0.8rem;margin-bottom:30px;color:var(--accent-blue);text-shadow:1px 1px 0 var(--maroon);}
.stage{background:linear-gradient(to bottom,#4A4A6A 0%,#2a2a4a 100%);border:4px solid var(--corn);padding:40px;margin-bottom:40px;min-height:300px;position:relative;overflow:hidden;box-shadow:inset 0 0 20px rgba(0,0,0,0.8),0 0 20px rgba(227,204,2,0.3);}
.spotlight{position:absolute;width:200px;height:200px;background:radial-gradient(circle,rgba(227,204,2,0.25) 0%,transparent 70%);border-radius:50%;animation:spotlightMove 4s ease-in-out infinite;pointer-events:none;}
@keyframes spotlightMove{0%,100%{top:-50px;left:10%;}50%{top:50px;left:30%;}}
.vendor-section{display:flex;align-items:center;justify-content:space-between;gap:40px;position:relative;z-index:2;}
.vendor-character{flex:0 0 150px;text-align:center;}
.pixel-art{width:120px;height:120px;background-size:100%;margin:0 auto 20px;image-rendering:pixelated;image-rendering:crisp-edges;animation:characterBounce 0.6s ease-in-out infinite;}
@keyframes characterBounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
.vendor-name{font-size:0.9rem;color:var(--corn);text-shadow:2px 2px 0 var(--maroon);margin-bottom:10px;word-break:break-word;}
.vendor-pitch{flex:1;background:rgba(0,0,0,0.5);border:3px dashed var(--accent-blue);padding:20px;min-height:150px;display:flex;flex-direction:column;justify-content:center;}
.pitch-title{font-size:1rem;color:var(--corn);margin-bottom:10px;text-shadow:1px 1px 0 var(--maroon);}
.pitch-text{font-size:0.65rem;color:var(--accent-blue);line-height:1.4;text-shadow:1px 1px 0 rgba(0,0,0,0.8);}
.judges-section{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:30px;}
.judge{background:linear-gradient(135deg,var(--maroon),#5a1018);border:4px solid var(--corn);padding:16px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,0.5),inset 0 0 10px rgba(227,204,2,0.1);transition:all 0.2s ease;position:relative;}
.judge:hover{transform:scale(1.03);}
.judge-avatar{display:flex;justify-content:center;margin-bottom:8px;}
.judge-avatar svg{image-rendering:pixelated;}
.judge-desk{width:100%;background:#222244;border:2px solid #aaaacc;padding:6px 4px 4px;margin-bottom:8px;display:flex;align-items:center;justify-content:center;gap:4px;position:relative;}
.x-panel{width:28px;height:24px;border:2px solid #555;border-radius:2px;display:flex;align-items:center;justify-content:center;font-size:10px;font-family:monospace;font-weight:bold;transition:all 0.3s ease;position:relative;overflow:hidden;}
.x-panel.off{background:#1a1a33;color:#444466;border-color:#333355;}
.x-panel.on{background:#fff;color:#ff2200;border-color:#ff6600;box-shadow:0 0 8px #ff4400,inset 0 0 6px rgba(255,100,0,0.4);animation:xPulse 0.5s ease-out;}
@keyframes xPulse{0%{transform:scale(1.2);}100%{transform:scale(1);}}
.judge-name{font-size:0.75rem;color:var(--corn);margin-bottom:12px;text-shadow:2px 2px 0 rgba(0,0,0,0.8);}
.vote-buttons{display:flex;gap:10px;margin-bottom:10px;}
.vote-btn{flex:1;padding:12px;font-family:'Press Start 2P',cursive;font-size:1.2rem;border:3px solid var(--text-light);background:none;color:var(--text-light);cursor:pointer;transition:all 0.1s ease;}
.yes-btn{background:#2a7a3a;color:var(--text-light);}
.yes-btn:hover{background:#3a9a4a;transform:scale(1.1);box-shadow:0 0 20px rgba(60,160,80,0.8);}
.yes-btn:active{transform:scale(0.95);}
.no-btn{background:var(--accent-red);color:var(--text-light);}
.no-btn:hover{background:#FF6666;transform:scale(1.1);box-shadow:0 0 20px rgba(255,68,68,0.8);}
.no-btn:active{transform:scale(0.95);}
.judge-status{font-size:0.65rem;color:var(--accent-blue);min-height:20px;}
.refresh-section{text-align:center;}
.refresh-btn{padding:15px 40px;font-family:'Press Start 2P',cursive;font-size:0.9rem;background:linear-gradient(135deg,var(--corn),#FFE800);border:4px solid var(--maroon);color:var(--maroon);cursor:pointer;transition:all 0.2s ease;box-shadow:0 8px 0 var(--maroon),inset 0 -4px 0 rgba(0,0,0,0.3);}
.refresh-btn:hover{transform:translateY(-2px);box-shadow:0 10px 0 var(--maroon);}
.refresh-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--maroon);}
.score-display{margin-top:20px;text-align:center;font-size:0.85rem;color:var(--corn);text-shadow:2px 2px 0 var(--maroon);}
.popup-vote{position:fixed;font-size:2rem;pointer-events:none;z-index:9999;animation:popupFloat 1s ease-out forwards;}
@keyframes popupFloat{0%{transform:translateY(0) scale(1);opacity:1;}100%{transform:translateY(-100px) scale(1.5);opacity:0;}}
@media(max-width:768px){.game-container{padding:20px;}.vendor-section{flex-direction:column;gap:20px;}.pitch-text{font-size:0.55rem;}.judges-section{grid-template-columns:1fr;}.game-title{font-size:1rem;}}
</style>
</head>

function lightUpX(judgeIndex){
  const panels=[`x${judgeIndex}a`,`x${judgeIndex}b`,`x${judgeIndex}c`];
  panels.forEach((id,i)=>{
    setTimeout(()=>{
      const el=document.getElementById(id);
      el.classList.remove('off');
      el.classList.add('on');
    },i*120);
  });
}
function dimX(judgeIndex){
  ['a','b','c'].forEach(s=>{
    const el=document.getElementById(`x${judgeIndex}${s}`);
    el.classList.remove('on');
    el.classList.add('off');
  });
}

function initGame(){
  currentScenario=scenarios[Math.floor(Math.random()*scenarios.length)];
  judgeVotes=[null,null,null];
  document.getElementById('vendorName').textContent=currentScenario.name;
  document.getElementById('pitchTitle').textContent=currentScenario.title;
  document.getElementById('pitchText').textContent=currentScenario.pitch;
  document.getElementById('vendorArt').style.backgroundImage=`url('${vendorArts[currentScenario.vendor]}')`;
  for(let i=0;i<3;i++){
    document.getElementById(`judge${i}Status`).textContent='';
    dimX(i);
  }
  document.getElementById('scoreDisplay').textContent='';
}

function judgeVote(judgeIndex,isYes){
  judgeVotes[judgeIndex]=isYes;
  const reactions=judgeReactions[judgeIndex];
  const reaction=isYes?reactions.yes[Math.floor(Math.random()*reactions.yes.length)]:reactions.no[Math.floor(Math.random()*reactions.no.length)];
  const color=isYes?'#3aaa4a':'#FF4444';
  document.getElementById(`judge${judgeIndex}Status`).textContent=reaction;
  document.getElementById(`judge${judgeIndex}Status`).style.color=color;
  if(!isYes){lightUpX(judgeIndex);}else{dimX(judgeIndex);}
  const popup=document.createElement('div');
  popup.className='popup-vote';
  popup.textContent=isYes?'&#10003;':'&#10007;';
  popup.style.color=color;
  popup.style.left=(judgeIndex*33+15)+'%';
  popup.style.top='50%';
  document.body.appendChild(popup);
  setTimeout(()=>popup.remove(),1000);
  if(judgeVotes.every(v=>v!==null)){displayFinalScore();}
}

function displayFinalScore(){
  const yesCount=judgeVotes.filter(v=>v===true).length;
  const messages=["&#127881; UNANIMOUS YES! VENDOR APPROVED!","&#128077; 2 YES! MOVING FORWARD!","&#9888;&#65039; MIXED VOTES! BACK TO DRAWING BOARD!","&#10060; REJECTED! TRY AGAIN NEXT TIME!"];
  const idx=yesCount===3?0:yesCount===2?1:yesCount===1?2:3;
  document.getElementById('scoreDisplay').innerHTML=messages[idx];
}

window.addEventListener('load',initGame);
</script>
